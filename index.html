<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOS Concept</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        /* Базовые сбросы */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            box-shadow: none !important;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        *::-webkit-scrollbar {
            display: none;
            width: 0;
            height: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #000;
            user-select: none;
        }

        /* --- КАСТОМНЫЙ КУРСОР --- */
        @media (min-width: 769px) {
            * { cursor: none !important; }
        }

        .custom-cursor {
            position: fixed;
            top: 0;
            left: 0;
            width: 38px;
            height: 38px;
            pointer-events: none;
            z-index: 1000000;
            will-change: transform;
            transition: opacity 0.15s ease;
        }

        .custom-cursor svg {
            width: 100%;
            height: 100%;
            fill: #ffffff;
            transform: scaleX(-1);
        }

        .ai-cursor-icon {
            position: absolute;
            top: -26px;
            left: 22px;
            width: 36px;
            height: 36px;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            
            background: linear-gradient(45deg, #1a73e8, #8ab4f8, #a042ff, #ff3366, #ffb300, #1a73e8);
            background-size: 300% 300%;
            -webkit-mask: url('ai-stars.png') center/contain no-repeat;
            mask: url('ai-stars.png') center/contain no-repeat;
            animation: aiIconGlow 3s infinite linear;
            
            filter: drop-shadow(0 0 6px rgba(26, 115, 232, 0.35));
            -webkit-transform: translate3d(0, 0, 0);
            transform: translate3d(0, 0, 0);
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            will-change: background-position, filter;
        }

        .custom-cursor.ai-active .ai-cursor-icon {
            opacity: 1;
        }

        @keyframes aiIconGlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }


        /* --- МОБИЛЬНАЯ ВЕРСИЯ --- */
        .mobile-stub {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            background: #000;
            color: #fff;
            text-align: center;
            padding: 20px;
        }

        .mobile-stub svg {
            width: 64px;
            height: 64px;
            fill: #ffffff;
            margin-bottom: 20px;
        }

        .mobile-stub p {
            font-size: 18px;
            font-weight: 500;
        }


        /* --- ПК ВЕРСИЯ (YOS) --- */
        .desktop-os {
            display: none;
            width: 100%;
            height: 100%;
            background: url('https://avatars.mds.yandex.net/i?id=818dfcd5017045a6e601010b97404429_l-17806471-images-thumbs&n=13') no-repeat;
            background-size: 100% 100%;
            position: relative;
        }

        /* Окна приложений */
        .window {
            position: absolute;
            top: 15%;
            left: 25%;
            width: 550px;
            height: 400px;
            background: #ffffff;
            border-radius: 12px;
            display: none;
            flex-direction: column;
            overflow: hidden;
            z-index: 10;
            transition: transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1), opacity 0.3s ease, width 0.3s cubic-bezier(0.1, 0.9, 0.2, 1), height 0.3s cubic-bezier(0.1, 0.9, 0.2, 1), top 0.3s cubic-bezier(0.1, 0.9, 0.2, 1), left 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
            transform: scale(0.9);
            opacity: 0;
        }

        .window.active-win {
            display: flex;
            transform: scale(1);
            opacity: 1;
        }

        .window.no-anim {
            transition: none !important;
        }

        #win-app1.window.maximized {
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            border-radius: 0;
            z-index: 99999 !important;
        }

        .window.maximized {
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: calc(100% - 96px) !important;
            border-radius: 0;
        }

        .window-header {
            height: 46px;
            background: #f1f1f1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            cursor: move;
        }

        #win-app1 .window-header {
            background: #16161a;
            border-bottom: 1px solid #232329;
        }

        #win-app1 .window-title { color: #ffffff; }
        #win-app1 .win-btn { color: #ffffff; }
        #win-app1 .win-btn-min svg, #win-app1 .win-btn-close svg { stroke: #ffffff; }
        #win-app1 .win-btn-max .max-icon { border-color: #ffffff; }

        .window-title {
            color: #000000;
            font-size: 15px;
            font-weight: 600;
        }

        .window-controls {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .win-btn {
            background: none;
            border: none;
            color: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
            transition: opacity 0.2s;
        }
        .win-btn:hover { opacity: 0.6; }

        .win-btn-min svg, .win-btn-close svg {
            width: 16px;
            height: 16px;
            stroke: #000000;
            stroke-width: 3.5px;
        }

        .win-btn-max .max-icon {
            width: 15px;
            height: 15px;
            border: 3.5px solid #000000;
            border-radius: 4px;
        }

        .window-content {
            flex: 1;
            padding: 20px;
            color: #000;
            position: relative;
        }

        .app-loading-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.22);
            backdrop-filter: blur(2px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            z-index: 2;
        }

        .window-content.is-loading iframe { filter: blur(8px); }
        .window-content.is-loading .app-loading-overlay { opacity: 1; }

        /* --- ИНТЕРФЕЙС NEXA AI --- */
        #win-app1 .window-content {
            background-color: #0c0c0e;
            display: flex;
            flex-direction: column;
            padding: 0;
            overflow: hidden;
        }

        .nexa-chat-container {
            flex: 1;
            width: 100%;
            padding: 40px 24px 120px 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
            position: relative;
        }

        .nexa-center-logo {
            position: absolute;
            top: 42%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 180px;
            height: auto;
            pointer-events: none;
            transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1), transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 1;
            z-index: 2;
        }

        .nexa-center-logo.hidden {
            opacity: 0;
            transform: translate(-50%, -60%) scale(0.9);
        }

        .nexa-user-msg {
            align-self: flex-end;
            background-color: #2a2a32;
            color: #ffffff;
            padding: 14px 22px;
            border-radius: 24px;
            max-width: 70%;
            font-size: 16px;
            line-height: 1.4;
            opacity: 0;
            transform: translateX(30px);
            animation: msgFlyIn 0.4s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
        }

        .nexa-ai-response {
            align-self: flex-start;
            width: 500px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            opacity: 0;
            transform: translateX(-30px);
            animation: msgFlyIn 0.4s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
        }

        @keyframes msgFlyIn {
            to { opacity: 1; transform: translateX(0); }
        }
        
        @keyframes skeletonFadeIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .nexa-skeleton {
            height: 14px;
            border-radius: 7px;
            background: linear-gradient(90deg, #222227 25%, #2f2f37 50%, #222227 75%);
            background-size: 200% 100%;
        }

        .nexa-input-wrapper {
            position: absolute;
            bottom: 28px;
            left: 10%;
            right: 10%;
            height: 64px;
            border-radius: 32px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 16px;
            z-index: 5;
            transition: opacity 0.3s;
            border: 1px solid transparent;
            background: linear-gradient(#16161a, #16161a) padding-box, 
                        linear-gradient(45deg, #1a73e8, #8ab4f8, #a042ff, #ff3366, #ffb300, #1a73e8) border-box;
            background-size: 100% 100%, 300% 300%;
            animation: aiBorderGlow 4s infinite linear;
        }

        .nexa-input-wrapper.disabled {
            opacity: 0.5;
            pointer-events: none;
        }

        .nexa-icon-btn {
            background: none;
            border: none;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
        }

        .nexa-icon-btn svg {
            width: 100%; height: 100%;
            fill: #8e8e93; transition: fill 0.2s;
        }

        .nexa-icon-btn:hover svg { fill: #ffffff; }

        .nexa-field {
            flex: 1; background: none; border: none; outline: none;
            color: #ffffff; font-size: 16px; font-family: inherit;
        }

        .nexa-field::placeholder { color: #636366; }

        .nexa-send-btn {
            opacity: 0.3; pointer-events: none;
            transition: opacity 0.2s, transform 0.2s;
        }

        .nexa-send-btn svg {
            transform: scaleY(-1);
            fill: #ffffff;
        }

        .nexa-send-btn.active { opacity: 1; pointer-events: auto; }
        .nexa-send-btn.active:active { transform: scale(0.9); }

        .resize-handle {
            position: absolute; right: 0; bottom: 0;
            width: 16px; height: 16px;
            cursor: se-resize; z-index: 11;
        }


        /* --- ДОК БАР --- */
        .dock-container {
            position: absolute; bottom: 24px; left: 24px; right: 24px;
            display: flex; justify-content: center; z-index: 999;
        }

        .dock-bar {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border-radius: 100px; display: flex; align-items: center;
            padding: 12px 24px; gap: 16px; width: 100%;
            justify-content: center; border: none; position: relative;
        }

        .dock-item {
            position: relative; width: 48px; height: 48px;
            border-radius: 50%; background: rgba(255, 255, 255, 0.6);
            transition: transform 0.15s cubic-bezier(0.25, 0.46, 0.45, 0.94), width 0.35s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.35s ease, margin 0.35s ease;
            display: flex; justify-content: center; cursor: pointer;
            flex-shrink: 0;
        }

        .dock-pill {
            width: 72px; height: 48px; border-radius: 24px;
            background: rgba(255, 255, 255, 0.85);
        }

        .dock-item.custom-dock-item:not(.revealed) { display: none; }

        .dock-item:active { transform: scale(0.8) !important; }

        .dock-item.open::after {
            content: ''; position: absolute; bottom: -8px;
            width: 6px; height: 6px; background: rgba(255, 255, 255, 0.9);
            border-radius: 50%; transition: width 0.2s, border-radius 0.2s;
        }

        .dock-item.open.minimized::after { width: 16px; border-radius: 4px; }

        .dock-separator {
            width: 1px; height: 28px; background: rgba(255, 255, 255, 0.3);
            margin: 0; flex-shrink: 0; position: absolute; right: 80px;
        }

        .dock-battery {
            width: 40px; height: 40px;
            background: url('battery.png') center/contain no-repeat;
            flex-shrink: 0; position: absolute; right: 24px;
        }


        /* --- AI MODE СЕТКА ВЫДЕЛЕНИЯ --- */
        .ai-selector-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 100000; display: none; pointer-events: none;
        }
        .ai-dim { position: fixed; background: rgba(0, 0, 0, 0.3); pointer-events: auto; }
        .ai-selection-box { position: absolute; border: 2px solid #fff; pointer-events: none; display: none; }


        /* --- ЭКРАН AI РЕЗУЛЬТАТОВ --- */
        .ai-results-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.2); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            z-index: 100100; display: none; align-items: center; justify-content: center;
            gap: 50px; opacity: 0; transition: opacity 0.4s ease;
        }

        .ai-results-screen.active-results { opacity: 1; }

        .ai-mode-logo {
            position: absolute; top: 60px; left: 50%; transform: translateX(-50%);
            height: 45px; width: auto; pointer-events: none; opacity: 0;
            transition: opacity 0.4s ease; z-index: 100200;
        }

        .ai-results-screen.active-results .ai-mode-logo { opacity: 1; }

        .ai-screenshot-result {
            width: 500px; height: 500px; background: #000; border-radius: 50px;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; position: relative; opacity: 0; transform: scale(0.8);
            transition: all 0.5s cubic-bezier(0.1, 0.9, 0.2, 1);
        }

        #aiCropInner { width: 100%; height: 100%; background-repeat: no-repeat; }

        .ai-card-result {
            width: 500px; height: 500px; border: 4px solid transparent; border-radius: 50px;
            background: linear-gradient(#ffffff, #ffffff) padding-box, 
                        linear-gradient(45deg, #1a73e8, #8ab4f8, #a042ff, #ff3366, #ffb300, #1a73e8) border-box;
            background-size: 100% 100%, 300% 300%;
            padding: 40px; display: flex; flex-direction: column; align-items: flex-start;
            gap: 18px; opacity: 0; transform: translateX(50px); transition: all 0.5s cubic-bezier(0.1, 0.9, 0.2, 1);
            position: relative; animation: aiBorderGlow 4s infinite linear;
            box-shadow: 0 0 35px rgba(26, 115, 232, 0.45);
        }

        @keyframes aiBorderGlow {
            0% { background-position: 0% 0%, 0% 50%; }
            50% { background-position: 0% 0%, 100% 50%; }
            100% { background-position: 0% 0%, 0% 50%; }
        }

        .skeleton-pill {
            height: 14px; border-radius: 7px; background: linear-gradient(90deg, #e5e5e5 25%, #f0f0f0 50%, #e5e5e5 75%);
            background-size: 200% 100%; animation: shimmer 1.6s infinite linear; opacity: 0;
            transform: translateY(10px); transition: opacity 0.4s ease, transform 0.4s ease;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }


        /* --- МЕНЮ СОЗДАНИЯ ПРИЛОЖЕНИЙ --- */
        .app-creator-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 100500; display: none; align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.4s ease;
        }
        .app-creator-overlay.active { opacity: 1; }

        .creator-panel {
            position: absolute; display: none; opacity: 0; transform: scale(0.9);
            transition: all 0.4s cubic-bezier(0.1, 0.9, 0.2, 1);
        }
        .creator-panel.active-panel { display: flex; }
        .creator-panel.show-panel { opacity: 1; transform: scale(1); }

        .ai-style-panel {
            border-radius: 50px;
            background: #ffffff;
        }

        /* Меню 1: Сетка */
        .creator-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 24px; padding: 40px; }
        .creator-circle {
            width: 80px; height: 80px; border-radius: 50%;
            background: #f0f0f0; display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: background 0.3s, transform 0.2s;
        }
        .creator-circle svg { width: 32px; height: 32px; stroke: #fff; opacity: 0; transition: opacity 0.3s; }
        .creator-circle:hover { background: #333; }
        .creator-circle:hover svg { opacity: 1; }
        .creator-circle:active { transform: scale(0.9); }

        /* Меню 2: Ввод URL */
        .menu2-container { display: flex; align-items: center; gap: 20px; }
        .menu2-btn {
            width: 80px; height: 80px; border-radius: 50%;
            background: #ffffff; border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.2s, background 0.3s;
        }
        .menu2-btn:active { transform: scale(0.9); }
        .menu2-btn svg { width: 36px; height: 36px; stroke: #000; transition: all 0.3s; position: relative; }
        .menu2-btn svg .icon-cross, .menu2-btn svg .icon-check {
            transition: opacity 0.35s ease;
        }
        .menu2-btn svg .icon-check { opacity: 0; }
        .menu2-btn svg.show-check .icon-cross { opacity: 0; }
        .menu2-btn svg.show-check .icon-check { opacity: 1; }
        
        .menu2-outer-pill {
            width: 400px; height: 80px; border-radius: 40px;
            background: linear-gradient(135deg, #e0e0e0, #ffffff);
            padding: 6px; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .menu2-inner-pill {
            width: 100%; height: 100%; border-radius: 34px;
            background: #ffffff; position: relative;
            display: flex; align-items: center;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
        }
        .menu2-placeholder {
            position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
            font-size: 20px; font-weight: 600; color: #888;
            transition: left 0.35s cubic-bezier(0.2, 0.8, 0.2, 1), transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.25s ease;
            pointer-events: none;
        }
        .menu2-input {
            width: 100%; height: 100%;
            background: transparent; border: none; outline: none;
            padding: 0 24px; font-size: 20px; color: #000; z-index: 2;
        }
        .menu2-input:focus ~ .menu2-placeholder,
        .menu2-input:not(:placeholder-shown) ~ .menu2-placeholder {
            left: 24px; transform: translate(0, -50%);
        }
        .menu2-input:not(:placeholder-shown) ~ .menu2-placeholder {
            opacity: 0;
        }

        /* Меню 3: Создание */
        .menu3-square {
            width: 320px; height: 220px; padding: 40px;
            display: flex; align-items: center; justify-content: center;
        }
        .menu3-img-btn {
            width: 120px; height: 120px; border-radius: 50%;
            background: #f0f0f0 center/cover no-repeat; border: none;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: transform 0.2s; box-shadow: inset 0 4px 10px rgba(0,0,0,0.05);
        }
        .menu3-img-btn:active { transform: scale(0.95); }
        .menu3-img-btn svg { width: 40px; height: 40px; stroke: #aaa; transition: opacity 0.3s; }
        .menu3-img-btn.has-img svg { opacity: 0; }
        
        .menu3-create-btn {
            width: 320px; height: 80px; border-radius: 40px;
            background: #ffffff; color: #000; font-size: 20px; font-weight: 600;
            border: none; cursor: pointer; transition: transform 0.2s, background 0.3s;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .menu3-create-btn:hover { background: #eeeeee; }
        .menu3-create-btn:active { transform: scale(0.95); }


        @media (max-width: 768px) {
            .mobile-stub { display: flex; }
            .custom-cursor { display: none; }
        }
        @media (min-width: 769px) {
            .desktop-os { display: block; }
        }
    </style>
</head>
<body>

    <div class="custom-cursor" id="cursor">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
            <path d="M541.9 139.5C546.4 127.7 543.6 114.3 534.7 105.4C525.8 96.5 512.4 93.6 500.6 98.2L84.6 258.2C71.9 263 63.7 275.2 64 288.7C64.3 302.2 73.1 314.1 85.9 318.3L262.7 377.2L321.6 554C325.9 566.8 337.7 575.6 351.2 575.9C364.7 576.2 376.9 568 381.8 555.4L541.8 139.4z" stroke="#000000" stroke-width="25" stroke-linejoin="round"/>
        </svg>
        <div class="ai-cursor-icon"></div>
    </div>

    <div class="mobile-stub">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
            <path d="M320 64C334.7 64 348.2 72.1 355.2 85L571.2 485C577.9 497.4 577.6 512.4 570.4 524.5C563.2 536.6 550.1 544 536 544L104 544C89.9 544 76.8 536.6 69.6 524.5C62.4 512.4 62.1 497.4 68.8 485L284.8 85C291.8 72.1 305.3 64 320 64zM320 416C302.3 416 288 430.3 288 448C288 465.7 302.3 480 320 480C337.7 480 352 465.7 352 448C352 430.3 337.7 416 320 416zM320 224C301.8 224 287.3 239.5 288.6 257.7L296 361.7C296.9 374.2 307.4 384 319.9 384C332.5 384 342.9 374.3 343.8 361.7L351.2 257.7C352.5 239.5 338.1 224 319.8 224z"/>
        </svg>
        <p>Ваше устройство не поддерживает YOS.</p>
    </div>

    <div class="desktop-os" id="desktop">
        
        <div class="window maximized" id="win-app1" style="display: none;">
            <div class="window-header" onmousedown="startDrag(event, 'app1')">
                <div class="window-title" onclick="refreshWindow('app1')">Nexa Ai</div>
                <div class="window-controls">
                    <button class="win-btn win-btn-min" onclick="minimizeWindow('app1')">
                        <svg viewBox="0 0 24 24" fill="none"><line x1="5" y1="12" x2="19" y2="12" stroke-linecap="round"/></svg>
                    </button>
                    <button class="win-btn win-btn-max" disabled style="opacity: 0.3; cursor: default;" onclick="return false;">
                        <div class="max-icon"></div>
                    </button>
                    <button class="win-btn win-btn-close" onclick="closeWindow('app1')">

    <script>
        window.addEventListener('contextmenu', e => e.preventDefault());

        const cursor = document.getElementById('cursor');
        const desktop = document.getElementById('desktop');
        
        let mouseX = 0, mouseY = 0;
        let isMouseDown = false;
        
        let aiMode = false;
        let aiSelecting = false;
        let aiStartX = 0, aiStartY = 0;

        if (window.matchMedia("(min-width: 769px)").matches) {
            document.addEventListener('mousemove', (e) => {
                mouseX = e.clientX;
                mouseY = e.clientY;
                updateCursorTransform();
                cursor.style.opacity = '1';
                
                if (aiSelecting) handleAiSelection(e);
            });

            // Скрываем курсор ОС только при выходе за пределы страницы.
            document.addEventListener('mouseout', (e) => {
                if (!e.relatedTarget && !e.toElement) {
                    cursor.style.opacity = '0';
                }
            });

            document.addEventListener('mousedown', (e) => {
                if (aiMode && e.button === 2) {
                    exitAiMode();
                    return;
                }

                if (e.button === 1) {
                    e.preventDefault();
                    if(!aiMode) enterAiMode(); else exitAiMode();
                    return;
                }

                if (e.button === 0) {
                    isMouseDown = true;
                    updateCursorTransform();
                    if (aiMode) startAiSelection(e);
                }
            });

            document.addEventListener('mouseup', (e) => {
                if (e.button === 0) {
                    isMouseDown = false;
                    updateCursorTransform();
                    if (aiSelecting) endAiSelection();
                }
            });
        }

        function updateCursorTransform() {
            let scale = isMouseDown ? 0.75 : 1;
            cursor.style.transform = `translate3d(${mouseX}px, ${mouseY}px, 0) scale(${scale})`;
        }

        // --- УПРАВЛЕНИЕ ОКНАМИ ---
        let dragWin = null, resizeWin = null;
        let offX, offY, startW, startH, startX, startY;
        const MIN_W = 320, MIN_H = 220;
        let topWindowZIndex = 10;

        function bringWindowToFront(win) {
            if (!win) return;
            win.style.zIndex = String(++topWindowZIndex);
        }

        document.addEventListener('mousedown', (event) => {
            bringWindowToFront(event.target.closest('.window'));
        });

        window.addEventListener('message', (event) => {
            const frame = [...document.querySelectorAll('.window iframe')]
                .find((item) => item.contentWindow === event.source);
            if (!frame || !event.data) return;

            if (event.data.type === 'yos-proxy-loading') {
                frame.closest('.window-content').classList.toggle('is-loading', event.data.loading);
                return;
            }
            if (event.data.type !== 'yos-proxy-event') return;

            const win = frame.closest('.window');
            bringWindowToFront(win);

            if (event.data.event === 'pointermove' && window.matchMedia('(min-width: 769px)').matches) {
                const frameRect = frame.getBoundingClientRect();
                mouseX = frameRect.left + event.data.x;
                mouseY = frameRect.top + event.data.y;
                updateCursorTransform();
                cursor.style.opacity = '1';
            }

            if (event.data.event === 'pointerleave') cursor.style.opacity = '0';
        });

        function startDrag(e, appId) {
            if (e.button !== 0) return;
            const win = document.getElementById(`win-${appId}`);
            bringWindowToFront(win);
            if (win.classList.contains('maximized')) return;
            dragWin = win;
            dragWin.classList.add('no-anim');
            offX = e.clientX - dragWin.offsetLeft;
            offY = e.clientY - dragWin.offsetTop;
            document.addEventListener('mousemove', dragProcess);
            document.addEventListener('mouseup', stopDrag);
        }

        function dragProcess(e) {
            if (!dragWin) return;
            dragWin.style.left = `${e.clientX - offX}px`;
            dragWin.style.top = `${e.clientY - offY}px`;
        }

        function stopDrag() {
            if (dragWin) dragWin.classList.remove('no-anim');
            dragWin = null;
            document.removeEventListener('mousemove', dragProcess);
            document.removeEventListener('mouseup', stopDrag);
        }

        function startResize(e, appId) {
            e.stopPropagation();
            e.preventDefault();
            const win = document.getElementById(`win-${appId}`);
            if (win.classList.contains('maximized')) return;
            resizeWin = win;
            resizeWin.classList.add('no-anim');
            startX = e.clientX;
            startY = e.clientY;
            startW = parseInt(document.defaultView.getComputedStyle(resizeWin).width, 10);
            startH = parseInt(document.defaultView.getComputedStyle(resizeWin).height, 10);
            document.addEventListener('mousemove', resizeProcess);
            document.addEventListener('mouseup', stopResize);
        }

        function resizeProcess(e) {
            if (!resizeWin) return;
            let newW = startW + (e.clientX - startX);
            let newH = startH + (e.clientY - startY);
            if (newW >= MIN_W && newW <= window.innerWidth) resizeWin.style.width = `${newW}px`;
            if (newH >= MIN_H && newH <= window.innerHeight) resizeWin.style.height = `${newH}px`;
        }

        function stopResize() {
            if (resizeWin) resizeWin.classList.remove('no-anim');
            resizeWin = null;
            document.removeEventListener('mousemove', resizeProcess);
            document.removeEventListener('mouseup', stopResize);
        }

        function handleDockClick(appId) {
            const win = document.getElementById(`win-${appId}`);
            const dockItem = document.getElementById(`dock-${appId}`);

            if (!win.classList.contains('active-win')) {
                if (win.dataset.reloadOnOpen === 'true') {
                    const frame = win.querySelector('iframe');
                    if (frame) frame.src = `/proxy?url=${encodeURIComponent(win.dataset.loadUrl)}`;
                    delete win.dataset.reloadOnOpen;
                }
                win.style.display = 'flex';
                setTimeout(() => win.classList.add('active-win'), 10);
                bringWindowToFront(win);
                dockItem.classList.add('open');
                dockItem.classList.remove('minimized');
            } else if (dockItem.classList.contains('minimized')) {
                win.style.display = 'flex';
                setTimeout(() => win.classList.add('active-win'), 10);
                bringWindowToFront(win);
                dockItem.classList.remove('minimized');
            } else {
                minimizeWindow(appId);
            }
        }

        function minimizeWindow(appId) {
            const win = document.getElementById(`win-${appId}`);
            const dockItem = document.getElementById(`dock-${appId}`);
            win.classList.remove('active-win');
            dockItem.classList.add('minimized');
            setTimeout(() => { if(!win.classList.contains('active-win')) win.style.display = 'none'; }, 300);
        }

        function maximizeWindow(appId) {
            const win = document.getElementById(`win-${appId}`);
            win.classList.toggle('maximized');
        }

        function refreshWindow(appId) {
            const win = document.getElementById(`win-${appId}`);
            if (!win) return;
            const frame = win.querySelector('iframe');
            if (frame) {
                const content = frame.closest('.window-content');
                if (content) content.classList.add('is-loading');
                frame.src = frame.src;
            }
        }

        function closeWindow(appId) {
            const win = document.getElementById(`win-${appId}`);
            const dockItem = document.getElementById(`dock-${appId}`);
            win.classList.remove('active-win');
            if (appId !== 'app1') win.classList.remove('maximized');
            dockItem.classList.remove('open');
            dockItem.classList.remove('minimized');
            if (win.querySelector('iframe')) win.dataset.reloadOnOpen = 'true';
            setTimeout(() => { if(!win.classList.contains('active-win')) win.style.display = 'none'; }, 300);
        }

        // --- ЛОГИКА NEXA AI ЧАТА ---
        const nexaInput = document.getElementById('nexaInput');
        const nexaSendBtn = document.getElementById('nexaSendBtn');
        const nexaChat = document.getElementById('nexaChat');
        const nexaLogo = document.getElementById('nexaLogo');
        const nexaInputWrapper = document.getElementById('nexaInputWrapper');
        let isFirstMessage = true;

        nexaInput.addEventListener('input', () => {
            if (nexaInput.value.trim().length > 0) {
                nexaSendBtn.classList.add('active');
            } else {
                nexaSendBtn.classList.remove('active');
            }
        });

        nexaInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && nexaInput.value.trim().length > 0) {
                sendNexaMessage();
            }
        });

        function sendNexaMessage() {
            const text = nexaInput.value.trim();
            if (!text) return;

            if (isFirstMessage) {
                nexaLogo.classList.add('hidden');
                isFirstMessage = false;
            }

            const userMsg = document.createElement('div');
            userMsg.className = 'nexa-user-msg';
            userMsg.textContent = text;
            nexaChat.appendChild(userMsg);

            nexaInput.value = '';
            nexaSendBtn.classList.remove('active');
            nexaInputWrapper.classList.add('disabled');
            nexaInput.blur();

            nexaChat.scrollTop = nexaChat.scrollHeight;

            setTimeout(() => {
                const aiResp = document.createElement('div');
                aiResp.className = 'nexa-ai-response';
                
                const numLines = Math.floor(Math.random() * 3) + 3;
                let skeletonHTML = '';
                for (let i = 0; i < numLines; i++) {
                    const width = Math.floor(Math.random() * 50) + 40; 
                    skeletonHTML += `<div class="nexa-skeleton" style="width: ${width}%; opacity: 0; transform: translateY(10px); animation: shimmer 1.6s infinite linear, skeletonFadeIn 0.4s ease forwards ${i * 0.15}s"></div>`;
                }
                
                aiResp.innerHTML = skeletonHTML;
                nexaChat.appendChild(aiResp);
                nexaChat.scrollTop = nexaChat.scrollHeight;

                setTimeout(() => {
                    nexaInputWrapper.classList.remove('disabled');
                }, 2500);

            }, 400);
        }


        // --- ЛОГИКА AI РЕЖИМА И ОБЛАСТИ ВЫДЕЛЕНИЯ ---
        const aiOverlay = document.getElementById('aiOverlay');
        const aiBox = document.getElementById('aiBox');
        const dTop = document.getElementById('dimTop'), dBottom = document.getElementById('dimBottom');
        const dLeft = document.getElementById('dimLeft'), dRight = document.getElementById('dimRight');

        function enterAiMode() {
            aiMode = true;
            cursor.classList.add('ai-active');
        }

        function exitAiMode() {
            aiMode = false;
            aiSelecting = false;
            cursor.classList.remove('ai-active');
            aiOverlay.style.display = 'none';
            aiBox.style.display = 'none';
        }

        function startAiSelection(e) {
            aiSelecting = true;
            aiStartX = e.clientX;
            aiStartY = e.clientY;
            aiOverlay.style.display = 'block';
            updateDims(aiStartX, aiStartY, 0, 0);
        }

        function handleAiSelection(e) {
            const currentX = e.clientX;
            const currentY = e.clientY;
            const x = Math.min(aiStartX, currentX);
            const y = Math.min(aiStartY, currentY);
            const w = Math.abs(aiStartX - currentX);
            const h = Math.abs(aiStartY - currentY);

            aiBox.style.display = 'block';
            aiBox.style.left = x + 'px';
            aiBox.style.top = y + 'px';
            aiBox.style.width = w + 'px';
            aiBox.style.height = h + 'px';

            updateDims(x, y, w, h);
        }

        function updateDims(x, y, w, h) {
            const screenW = window.innerWidth;
            const screenH = window.innerHeight;
            dTop.style.top = '0px'; dTop.style.left = '0px'; dTop.style.width = screenW + 'px'; dTop.style.height = y + 'px';
            dBottom.style.top = (y + h) + 'px'; dBottom.style.left = '0px'; dBottom.style.width = screenW + 'px'; dBottom.style.height = (screenH - (y + h)) + 'px';
            dLeft.style.top = y + 'px'; dLeft.style.left = '0px'; dLeft.style.width = x + 'px'; dLeft.style.height = h + 'px';
            dRight.style.top = y + 'px'; dRight.style.left = (x + w) + 'px'; dRight.style.width = (screenW - (x + w)) + 'px'; dRight.style.height = h + 'px';
        }

        function endAiSelection() {
            aiSelecting = false;
            const boxRect = aiBox.getBoundingClientRect();
            exitAiMode();
            if(boxRect.width > 5 && boxRect.height > 5) {
                launchAiResults(boxRect);
            }
        }

        // --- ОКНО РЕЗУЛЬТАТОВ ИМИТАЦИИ СЕТИ ---
        const aiScreen = document.getElementById('aiResultsScreen');
        const aiScreenshot = document.getElementById('aiScreenshot');
        const aiCropInner = document.getElementById('aiCropInner');
        const aiCard = document.getElementById('aiCard');

        function launchAiResults(rect) {
            html2canvas(document.getElementById('desktop'), { backgroundColor: null, useCORS: true }).then(canvas => {
                let imgData = canvas.toDataURL('image/png');
                
                let containerSize = 500; 
                let scaleFactor = Math.max(containerSize / rect.width, containerSize / rect.height);
                
                let offsetX = (containerSize - rect.width * scaleFactor) / 2;
                let offsetY = (containerSize - rect.height * scaleFactor) / 2;

                let bgW = window.innerWidth * scaleFactor;
                let bgH = window.innerHeight * scaleFactor;

                let posX = -(rect.left * scaleFactor) + offsetX;
                let posY = -(rect.top * scaleFactor) + offsetY;

                aiCropInner.style.backgroundSize = `${bgW}px ${bgH}px`;
                aiCropInner.style.backgroundPosition = `${posX}px ${posY}px`;
                aiCropInner.style.backgroundImage = `url('${imgData}')`;

                aiScreenshot.style.opacity = '0';
                aiScreenshot.style.transform = 'scale(0.8) translateY(40px)';
                aiCard.style.opacity = '0';
                aiCard.style.transform = 'translateX(50px) translateY(40px)';
                
                document.querySelectorAll('.ai-results-screen .skeleton-pill').forEach(pill => {
                    pill.style.opacity = '0';
                    pill.style.transform = 'translateY(10px)';
                });

                aiScreen.style.display = 'flex';
                
                setTimeout(() => {
                    aiScreen.classList.add('active-results');
                    aiScreenshot.style.opacity = '1';
                    aiScreenshot.style.transform = 'scale(1) translateY(40px)';
                    aiCard.style.opacity = '1';
                    aiCard.style.transform = 'translateX(0) translateY(40px)';
                }, 50);

                setTimeout(() => {
                    const pills = document.querySelectorAll('.ai-results-screen .skeleton-pill');
                    pills.forEach((pill, index) => {
                        setTimeout(() => {
                            pill.style.opacity = '1';
                            pill.style.transform = 'translateY(0)';
                        }, index * 80);
                    });
                }, 1000);
            });
        }

        function closeAiResults() {
            aiScreen.classList.remove('active-results');
            setTimeout(() => {
                aiScreen.style.display = 'none';
            }, 400);
        }

        // --- ЛОГИКА МЕНЮ СОЗДАНИЯ ПРИЛОЖЕНИЙ ---
        const creatorOverlay = document.getElementById('creatorOverlay');
        const menu1 = document.getElementById('creatorMenu1');
        const menu2 = document.getElementById('creatorMenu2');
        const menu3 = document.getElementById('creatorMenu3');
        const urlInput = document.getElementById('creatorUrlInput');
        const menu2ActionBtn = document.getElementById('menu2ActionBtn');
        const menu2Icon = document.getElementById('menu2Icon');
        const creatorGrid = document.getElementById('creatorGrid');

        const svgCross = `<path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>`;
        const svgCheck = `<path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>`;

        let currentCreatorCircle = null;
        let customAppCounter = 0;

        function makeCreatorCircle() {
            const circle = document.createElement('div');
            circle.className = 'creator-circle';
            circle.innerHTML = `<svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`;
            circle.onclick = function() {
                currentCreatorCircle = circle;
                openCreatorMenu2();
            };
            return circle;
        }

        // Генерация 10 кружков приложений
        for (let i = 0; i < 10; i++) {
            creatorGrid.appendChild(makeCreatorCircle());
        }

        // --- Проверка ссылки на валидность (не пропускаем случайный текст) ---
        function isValidUrlText(str) {
            const value = str.trim();
            if (!value) return false;
            const pattern = /^(https?:\/\/)?(www\.)?[a-zA-Zа-яА-Я0-9]([a-zA-Zа-яА-Я0-9-]{0,61}[a-zA-Zа-яА-Я0-9])?(\.[a-zA-Zа-яА-Я0-9]([a-zA-Zа-яА-Я0-9-]{0,61}[a-zA-Zа-яА-Я0-9])?)+(:\d+)?(\/[^\s]*)?$/;
            return pattern.test(value);
        }

        function cleanUrlForDisplay(str) {
            return str.trim().replace(/^https?:\/\//i, '').replace(/\/+$/, '');
        }

        function normalizeUrlForLoad(str) {
            const value = str.trim();
            return /^https?:\/\//i.test(value) ? value : 'https://' + value;
        }

        function switchPanel(hidePanel, showPanel) {
            hidePanel.classList.remove('show-panel');
            setTimeout(() => {
                hidePanel.classList.remove('active-panel');
                showPanel.classList.add('active-panel');
                setTimeout(() => {
                    showPanel.classList.add('show-panel');
                }, 50);
            }, 400);
        }

        function openAppCreator() {
            creatorOverlay.style.display = 'flex';
            
            // Сброс данных при открытии
            currentCreatorCircle = null;
            urlInput.value = '';
            checkUrlInput();
            document.getElementById('menu3ImgBtn').style.backgroundImage = '';
            document.getElementById('menu3ImgBtn').classList.remove('has-img');
            
            menu1.classList.remove('active-panel', 'show-panel');
            menu2.classList.remove('active-panel', 'show-panel');
            menu3.classList.remove('active-panel', 'show-panel');
            
            setTimeout(() => {
                creatorOverlay.classList.add('active');
                menu1.classList.add('active-panel');
                setTimeout(() => menu1.classList.add('show-panel'), 50);
            }, 10);
        }

        function closeAppCreator() {
            creatorOverlay.classList.remove('active');
            setTimeout(() => {
                creatorOverlay.style.display = 'none';
                menu1.classList.remove('active-panel', 'show-panel');
                menu2.classList.remove('active-panel', 'show-panel');
                menu3.classList.remove('active-panel', 'show-panel');
            }, 400);
        }

        function openCreatorMenu2() {
            switchPanel(menu1, menu2);
        }

        function closeCreatorMenu2() {
            switchPanel(menu2, menu1);
        }

        function goToMenu3() {
            switchPanel(menu2, menu3);
        }

        function checkUrlInput() {
            if (isValidUrlText(urlInput.value)) {
                menu2Icon.classList.add('show-check');
                menu2ActionBtn.onclick = goToMenu3;
            } else {
                menu2Icon.classList.remove('show-check');
                menu2ActionBtn.onclick = closeCreatorMenu2;
            }
        }

        function previewCreatorImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const btn = document.getElementById('menu3ImgBtn');
                    btn.style.backgroundImage = `url('${e.target.result}')`;
                    btn.classList.add('has-img');
                }
                reader.readAsDataURL(file);
            }
        }

        function createAppWindow(appId, url) {
            const displayUrl = cleanUrlForDisplay(url);
            const loadUrl = normalizeUrlForLoad(url);
            const proxyUrl = `/proxy?url=${encodeURIComponent(loadUrl)}`;

            const win = document.createElement('div');
            win.className = 'window';
            win.id = `win-${appId}`;
            win.dataset.loadUrl = loadUrl;
            const offset = (customAppCounter % 5) * 20;
            win.style.top = `calc(15% + ${offset}px)`;
            win.style.left = `calc(25% + ${offset}px)`;

            win.innerHTML = `
                <div class="window-header" onmousedown="startDrag(event, '${appId}')">
                    <div class="window-title" onclick="refreshWindow('${appId}')">${displayUrl}</div>
                    <div class="window-controls">
                        <button class="win-btn win-btn-min" onclick="minimizeWindow('${appId}')">
                            <svg viewBox="0 0 24 24" fill="none"><line x1="5" y1="12" x2="19" y2="12" stroke-linecap="round"/></svg>
                        </button>
                        <button class="win-btn win-btn-max" onclick="maximizeWindow('${appId}')">
                            <div class="max-icon"></div>
                        </button>
                        <button class="win-btn win-btn-close" onclick="closeCustomApp('${appId}')">
                            <svg viewBox="0 0 24 24" fill="none"><line x1="18" y1="6" x2="6" y2="18" stroke-linecap="round"/><line x1="6" y1="6" x2="18" y2="18" stroke-linecap="round"/></svg>
                        </button>
                    </div>
                </div>
                <div class="window-content is-loading" style="padding: 0; display: flex; flex-direction: column;">
                    <iframe src="${proxyUrl}" style="flex: 1; width: 100%; border: none;" referrerpolicy="no-referrer" allow="fullscreen"></iframe>
                    <div class="app-loading-overlay" aria-hidden="true"></div>
                </div>
                <div class="resize-handle" onmousedown="startResize(event, '${appId}')"></div>
            `;
            desktop.appendChild(win);

            // Скрытый (пока не открыт) элемент дока — появится плавно при первом открытии
            const dockItem = document.createElement('div');
            dockItem.className = 'dock-item custom-dock-item';
            dockItem.id = `dock-${appId}`;
            dockItem.style.width = '0px';
            dockItem.style.opacity = '0';
            dockItem.style.overflow = 'hidden';
            dockItem.onclick = function() { handleDockClick(appId); };
            document.querySelector('.dock-separator').insertAdjacentElement('beforebegin', dockItem);
        }

        function openCustomApp(appId) {
            closeAppCreator();
            revealDockIcon(appId);
            handleDockClick(appId);
        }

        function revealDockIcon(appId) {
            const item = document.getElementById(`dock-${appId}`);
            if (item && !item.classList.contains('revealed')) {
                item.classList.add('revealed');
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        item.style.width = '48px';
                        item.style.opacity = '1';
                    });
                });
                setTimeout(() => { item.style.overflow = 'visible'; }, 400);
            }
        }

        function closeCustomApp(appId) {
            closeWindow(appId);
            const item = document.getElementById(`dock-${appId}`);
            if (item) {
                item.classList.remove('open', 'minimized');
                item.style.overflow = 'hidden';
                item.style.width = '0px';
                item.style.opacity = '0';
                setTimeout(() => item.classList.remove('revealed'), 350);
            }
        }

        function finishCreateApp() {
            const url = urlInput.value;
            if (!isValidUrlText(url) || !currentCreatorCircle) return;

            customAppCounter++;
            const appId = `custom${customAppCounter}`;

            createAppWindow(appId, url);

            const circle = currentCreatorCircle;
            const iconBg = document.getElementById('menu3ImgBtn').style.backgroundImage;

            if (iconBg && iconBg !== 'none') {
                circle.innerHTML = `<div style='width:100%;height:100%;border-radius:50%;background-image:${iconBg};background-size:cover;background-position:center;'></div>`;
            } else {
                const letter = cleanUrlForDisplay(url).charAt(0).toUpperCase();
                circle.innerHTML = `<div style='width:100%;height:100%;border-radius:50%;background:#333;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:24px;'>${letter}</div>`;
            }
            circle.onclick = function() {
                openCustomApp(appId);
            };

            currentCreatorCircle = null;
            switchPanel(menu3, menu1);
        }
    </script>
</body>
</html>
